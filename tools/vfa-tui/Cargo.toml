[package]
name = "vfa-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Enterprise-grade terminal UI for the Vanguard Frontier Agentic marketplace catalog"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Raishin/vanguard-frontier-agentic"
homepage = "https://github.com/Raishin/vanguard-frontier-agentic/tree/master/tools/vfa-tui"
readme = "README.md"
keywords = ["tui", "catalog", "marketplace", "terminal", "security"]
categories = ["command-line-utilities", "development-tools"]
authors = ["Raishin <raishin@users.noreply.github.com>"]
exclude = [
    "proptest-regressions/",
    "tests/",
    "~/",
    "target/",
    ".gitignore",
]

[[bin]]
name = "vfa-tui"
path = "src/main.rs"
required-features = ["terminal"]

[features]
default = ["terminal"]
terminal = [
    "dep:ratatui",
    "dep:crossterm",
    "dep:clap",
    "dep:tracing-subscriber",
    "dep:terminal-light",
]

[dependencies]
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.28", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "time"], optional = true }
thiserror = "2"
anyhow = "1"
nucleo-matcher = "0.3"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
notify-debouncer-full = "0.3"
toml = "0.8"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
terminal-light = { version = "1", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
tempfile = "3"
