[package]
name = "vfa-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
description = "Native desktop adapter for the Vanguard Frontier Agentic engine"
license = "MIT OR Apache-2.0"

[dependencies]
gpui-kit = { version = "=0.9.1", default-features = false, features = ["component", "assets"] }
vfa-tui = { path = "../vfa-tui", default-features = false }

[dev-dependencies]
gpui-kit = { version = "=0.9.1", default-features = false, features = ["component", "assets", "test-support"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
raw-window-handle = "0.6"

[[test]]
name = "native_smoke"
harness = false
test = false

[profile.dev]
debug = 0

[profile.test]
debug = 0
