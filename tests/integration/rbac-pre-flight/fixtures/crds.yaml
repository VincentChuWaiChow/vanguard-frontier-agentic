# tests/integration/rbac-pre-flight/fixtures/crds.yaml
#
# Minimal stand-ins for the third-party CRDs the guards assert against.
#
# Why these are needed, and why stubs are enough
# ----------------------------------------------
# `kubectl auth can-i` resolves its resource argument through discovery before
# posting the SelfSubjectAccessReview.  When the resource is absent,
# resourceFor() warns and falls back to
# `GroupVersionResource{Resource: <the whole dotted argument>}` with an EMPTY
# group (kubernetes/kubernetes
# staging/src/k8s.io/kubectl/pkg/cmd/auth/cani.go, identical at v1.28.15 and
# v1.31.2).  The review therefore asks about {group: "", resource:
# "schedules.velero.io"}, which no RBAC rule can match, and kubectl answers
# "no" whatever the manifests actually grant.
#
# Measured against a live kube-apiserver v1.30.6 with RBAC, for a service
# account explicitly granted velero.io/schedules create:
#
#   CRD absent   -> "no"   + "the server doesn't have a resource type
#                            'schedules' in group 'velero.io'" on stderr
#   CRD present  -> "yes"
#
# So the absent-CRD verdict is not merely unavailable, it is wrong in both
# directions: every must-not check would pass vacuously and every must-be-able
# check would fail spuriously.
#
# Discovery is all that is required -- nothing here is ever instantiated, and
# no controller reconciles it.  Only `group`, `names.plural`, `names.kind` and
# `scope` are load-bearing; the schema is deliberately open.  Shipping stubs
# in-tree rather than fetching upstream bundles keeps the gate deterministic:
# no network at test time, no version drift, and the same behaviour on every
# Kubernetes version in the matrix.
#
# Built-in Kubernetes resources are NOT stubbed here -- a CRD cannot shadow a
# built-in API group, and their absence really would mean a broken cluster.
#
# The gateway.networking.k8s.io stubs carry `api-approved.kubernetes.io`.  Any
# group under *.k8s.io is protected: apiextensions rejects a CRD in one without
# that annotation ("protected groups must have approval annotation").  The URL
# is the Gateway API's own approval, KEP PR 1111, the same value the upstream
# CRDs carry -- it records which review approved the group, and is not a claim
# that these stubs are the upstream schemas.
#
# Keep in sync with the `*_or_skip` assertions in guards/; every resource the
# guards name with a group suffix needs an entry.
---
