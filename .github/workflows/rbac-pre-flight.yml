name: RBAC Pre-flight Integration Test

on:
  push:
    paths:
      - 'agents/**/references/least-privilege-rbac.yaml'
      - 'skills/**/references/least-privilege-rbac.yaml'
      - 'agents/**/references/rbac-pre-flight.md'
      - 'skills/**/references/rbac-pre-flight.md'
      - 'tests/integration/rbac-pre-flight/**'
      - '.github/workflows/rbac-pre-flight.yml'
  pull_request:
    paths:
      - 'agents/**/references/least-privilege-rbac.yaml'
      - 'skills/**/references/least-privilege-rbac.yaml'
      - 'agents/**/references/rbac-pre-flight.md'
      - 'skills/**/references/rbac-pre-flight.md'
      - 'tests/integration/rbac-pre-flight/**'
      - '.github/workflows/rbac-pre-flight.yml'
  workflow_dispatch: {}

# Least-privilege baseline: this suite only reads the repository and creates a
# throwaway kind cluster on the runner.
permissions:
  contents: read

jobs:
  # The harness's own logic, with no cluster: stream handling, skip-vs-error
  # classification, exit codes, and the subresource-syntax lint.  Seconds
  # rather than minutes, and it catches the class of bug that previously made
  # 176 of 294 assertions silently stop running.
  harness-self-test:
    name: Harness self-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run harness self-test
        run: |
          chmod +x tests/integration/rbac-pre-flight/self-test.sh
          tests/integration/rbac-pre-flight/self-test.sh

  rbac-pre-flight:
    name: RBAC Pre-flight (${{ matrix.k8s-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        k8s-version: ['v1.28.15', 'v1.29.10', 'v1.30.6', 'v1.31.2']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install kind
        uses: helm/kind-action@0025e74a8c7512023d06dc019c617aa3cf561fde # v1.10.0
        with:
          install_only: true

      - name: Run RBAC pre-flight tests
        run: |
          chmod +x tests/integration/rbac-pre-flight/run-all.sh
          tests/integration/rbac-pre-flight/run-all.sh
        env:
          KIND_K8S_VERSION: ${{ matrix.k8s-version }}

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rbac-preflight-results-${{ matrix.k8s-version }}
          path: /tmp/rbac-preflight-*.log
