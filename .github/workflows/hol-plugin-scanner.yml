name: HOL Plugin Scanner

# HOL AI Plugin Scanner — continuous self-check against the bar HOL applies
# when listing on its plugin catalogs (hashgraph-online/awesome-ai-plugins,
# hashgraph-online/awesome-codex-plugins). The scanner's passing criteria are
# score >= 80 with no critical or high findings.
#
# Source-repository scanner CI is NOT itself a listing requirement: per
# SCANNER_GUIDE.md (retrieved 2026-09-11) HOL scans listed projects
# independently, projects without scanner CI remain eligible but take a 10%
# trust-score reduction, and catalog scan results are advisory for admission.
# We run it anyway so findings surface here, on the commit that caused them,
# instead of on a catalog pull request.
#
# Two jobs:
#   gate        — scans the submitted Codex plugin bundle and enforces the
#                 >= 80 / no-high-critical bar. Blocking: this is the gate we
#                 hold ourselves to, so a regression fails here rather than
#                 being discovered during a catalog review.
#   marketplace — scans the repo root so the marketplace metadata
#                 (.agents/plugins/marketplace.json) and the second plugin
#                 (cross-platform-agent-template) are validated for
#                 visibility. Non-blocking: it reports but does not fail PRs.
#
# In both jobs the scanner runs in non-failing mode (min_score: 0,
# fail_on_severity: none) so SARIF is always uploaded to code scanning —
# including on failing scans, which the action's built-in gate would
# otherwise skip. The pass/fail decision is enforced by a separate step
# that reads the action's score/max_severity outputs.
#
# Docs:
#   https://github.com/hashgraph-online/awesome-ai-plugins/blob/main/SCANNER_GUIDE.md
#   https://github.com/hashgraph-online/awesome-codex-plugins (SCANNER_GUIDE.md)
#   https://github.com/hashgraph-online/ai-plugin-scanner-action

on:
  push:
    branches: [master]
  pull_request:

# Least-privilege baseline. SARIF upload to GitHub code scanning needs
# security-events: write; actions: read is required by the embedded
# github/codeql-action/upload-sarif step on private/internal mirrors and
# matches this repo's CodeQL/Scorecard workflows.
permissions:
  contents: read

jobs:
  gate:
    name: Listing gate (Codex plugin bundle)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The scanner only reads the tree; leaving the checkout token in
          # .git/config would hand write-capable credentials to a third-party
          # action for no benefit. Matches the HOL scanner guide's recommended
          # workflow and this repo's other read-only jobs.
          persist-credentials: false

      - name: HOL AI Plugin Scanner (report + upload SARIF)
        id: scan
        uses: hashgraph-online/ai-plugin-scanner-action@caba2e96aa8ad2feb6cf6fca52442b52e22e779f # v1.2.635
        with:
          plugin_dir: "plugins/vanguard-frontier-agentic"
          mode: scan
          format: sarif
          # No config here: the `config` path is resolved relative to plugin_dir,
          # and the bundle scan (skills + manifest only) has no false positives
          # to suppress. The repo-root scan below carries the .plugin-scanner.toml.
          upload_sarif: true
          sarif_category: vfa-plugin-bundle
          write_step_summary: "true"
          # Non-failing: gate is enforced below so SARIF uploads even on a
          # failing scan.
          min_score: "0"
          fail_on_severity: none

      - name: Enforce marketplace listing gate
        env:
          SCORE: ${{ steps.scan.outputs.score }}
          MAX_SEVERITY: ${{ steps.scan.outputs.max_severity }}
          FINDINGS_TOTAL: ${{ steps.scan.outputs.findings_total }}
        run: |
          echo "score=${SCORE:-<none>} max_severity=${MAX_SEVERITY:-none} findings_total=${FINDINGS_TOTAL:-0}"
          if [ -z "$SCORE" ]; then
            echo "::error::scanner did not emit a score; cannot evaluate listing gate"
            exit 1
          fi
          fail=0
          below=$(awk -v s="$SCORE" 'BEGIN { print (s + 0 < 80) ? 1 : 0 }')
          if [ "$below" = "1" ]; then
            echo "::error::score $SCORE is below the required minimum of 80"
            fail=1
          fi
          case "$(printf '%s' "$MAX_SEVERITY" | tr '[:upper:]' '[:lower:]')" in
            high|critical)
              echo "::error::max severity '$MAX_SEVERITY' exceeds allowed level (no high/critical permitted)"
              fail=1
              ;;
          esac
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "Listing gate passed: score $SCORE >= 80 with no high/critical findings."

  marketplace:
    name: Marketplace scan (repo root, non-blocking)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same rationale as the gate job above: read-only scan, so the
          # checkout credential is dropped rather than persisted.
          persist-credentials: false

      - name: HOL AI Plugin Scanner (marketplace root)
        id: scan
        uses: hashgraph-online/ai-plugin-scanner-action@caba2e96aa8ad2feb6cf6fca52442b52e22e779f # v1.2.635
        with:
          plugin_dir: "."
          mode: scan
          format: sarif
          # Path-scoped false-positive suppression (data/docs/fixtures only;
          # secret-detection stays active on executable code). The config path is
          # resolved relative to plugin_dir, which is the repo root (".") here.
          # See the file's header for the per-alert rationale.
          config: ".plugin-scanner.toml"
          upload_sarif: true
          sarif_category: vfa-marketplace-root
          write_step_summary: "true"
          # Visibility only — never fail the build here.
          min_score: "0"
          fail_on_severity: none

      - name: Report marketplace scan result
        env:
          SCORE: ${{ steps.scan.outputs.score }}
          MAX_SEVERITY: ${{ steps.scan.outputs.max_severity }}
          FINDINGS_TOTAL: ${{ steps.scan.outputs.findings_total }}
        run: |
          echo "marketplace-root score=${SCORE:-<none>} max_severity=${MAX_SEVERITY:-none} findings_total=${FINDINGS_TOTAL:-0}"
          echo "This scan is informational; results are published to code scanning under category 'vfa-marketplace-root'."
