name: Release

on:
  push:
    branches:
      # master → stable releases; develop → alpha prereleases.
      # Both are configured as release channels in .releaserc.js
      # (develop carries `prerelease: "alpha"`).
      - master
      - develop
  # Manual dispatch for forensics/recovery: lets a maintainer re-run the
  # release pipeline without producing a no-op commit. semantic-release
  # is idempotent — if the latest tag already covers HEAD it logs
  # "There are no relevant changes, so no new version is released."
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run semantic-release in --dry-run mode (no publish, no tag, no commit)."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      republish:
        description: "Re-publish current package.json version to npm without a new semantic-release bump. Use when a GitHub Release was created but npm publish failed."
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

# Top-level least-privilege baseline (Scorecard Token-Permissions).
# Write scopes are granted only on the `release` job that needs them.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    # Must match the environment name configured in the npm trusted publisher
    # settings on npmjs.com. The OIDC token carries this claim and npm
    # validates it against the registered trusted publisher entry.
    environment: npm-deployment-master
    permissions:
      # contents:write — semantic-release pushes the chore(release) commit
      #   and creates the GitHub release/tag.
      # issues:write, pull-requests:write — semantic-release/github comments
      #   on related issues/PRs (disabled in our config but the plugin
      #   probes the scope at startup).
      # id-token:write — OIDC for npm trusted publishing (replaces NPM_TOKEN),
      #   npm provenance, and Sigstore attestations.
      # attestations:write — actions/attest-build-provenance writes the
      #   attestation bundle.
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      # persist-credentials must be true here because @semantic-release/git
      # pushes the `chore(release): X.Y.Z [skip ci]` commit (CHANGELOG.md +
      # package.json bump) back to the release branch (master or develop).
      # Without persisted creds the push silently no-ops and no tag/release
      # is produced, which previously blocked v1.4.0. This workflow only runs
      # on push to master or develop (trusted refs) so token persistence is
      # acceptable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node 24 bundles npm 10.x. npm >= 11.5.1 is required for native
          # OIDC trusted-publisher token exchange. setup-node's registry-url
          # configures .npmrc with the npm registry.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # CRITICAL: setup-node@v6 with `registry-url` writes
      #   //registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}
      # to ${RUNNER_TEMP}/.npmrc and exports NPM_CONFIG_USERCONFIG pointing
      # at that file (see actions/setup-node v6.4.0 src/authutil.ts). It does
      # NOT write to ~/.npmrc — targeting the wrong path leaves the poisoned
      # entry in npm's active userconfig.
      #
      # With OIDC trusted publishing, NODE_AUTH_TOKEN is intentionally unset,
      # so npm reads the line as `_authToken=` (empty value). npm 11.x sees
      # ANY _authToken entry and short-circuits the OIDC token exchange, then
      # PUTs the tarball with an empty Authorization header. npmjs.com responds
      # with HTTP 404 to unauthenticated writes on existing scoped packages
      # (documented behavior — not a true "not found"). Stripping the
      # _authToken line forces npm to take the OIDC code path.
      - name: Strip empty _authToken from active .npmrc for OIDC publish
        run: |
          # NPM_CONFIG_USERCONFIG is the file npm actually reads. setup-node@v6
          # sets it to ${RUNNER_TEMP}/.npmrc; fall back to ~/.npmrc only when
          # setup-node was bypassed.
          NPMRC_PATH="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "Active npmrc path: $NPMRC_PATH"
          if [ -f "$NPMRC_PATH" ]; then
            echo "Before strip:"
            cat "$NPMRC_PATH"
            sed -i '/_authToken/d' "$NPMRC_PATH"
            echo "After strip:"
            cat "$NPMRC_PATH"
          else
            echo "No .npmrc found at $NPMRC_PATH (no strip needed)"
          fi
          # Also strip ~/.npmrc defensively in case a future setup-node version
          # changes its config location or both files end up in npm's resolution
          # chain. Cheap insurance against silent regressions.
          if [ -f "$HOME/.npmrc" ] && [ "$HOME/.npmrc" != "$NPMRC_PATH" ]; then
            echo "Also stripping ~/.npmrc defensively:"
            sed -i '/_authToken/d' "$HOME/.npmrc"
          fi

      # Verify what npm will actually use for its config.
      - name: Verify npm config resolution
        run: |
          echo "::group::Environment and config state"
          echo "NPM_CONFIG_USERCONFIG: ${NPM_CONFIG_USERCONFIG:-<unset>}"
          echo "RUNNER_TEMP: ${RUNNER_TEMP:-<unset>}"
          echo "HOME: ${HOME:-<unset>}"
          echo "npm config get userconfig: $(npm config get userconfig)"
          echo "npm config get registry: $(npm config get registry)"
          echo "npm config get @raishin:registry: $(npm config get @raishin:registry)"
          echo "::endgroup::"
          echo "::group::Actual config file contents"
          if [ -n "$NPM_CONFIG_USERCONFIG" ] && [ -f "$NPM_CONFIG_USERCONFIG" ]; then
            echo "File at NPM_CONFIG_USERCONFIG ($NPM_CONFIG_USERCONFIG):"
            cat "$NPM_CONFIG_USERCONFIG"
          fi
          if [ -f "$HOME/.npmrc" ]; then
            echo "File at ~/.npmrc:"
            cat "$HOME/.npmrc"
          fi
          if [ -n "$RUNNER_TEMP" ] && [ -f "$RUNNER_TEMP/.npmrc" ]; then
            echo "File at \$RUNNER_TEMP/.npmrc:"
            cat "$RUNNER_TEMP/.npmrc"
          fi
          echo "::endgroup::"

      # CRITICAL DIAGNOSTIC: decode the actual OIDC token claims to verify
      # what GitHub is sending to npmjs.com. Compare these claims character-for-
      # character against the trusted publisher entry on npmjs.com:
      # - repository_owner (must match registered owner — CASE SENSITIVE!)
      # - repository (must match registered repo)
      # - workflow_ref (must contain registered workflow filename)
      # - environment (must match registered environment)
      #
      # The OIDC token's `repository_owner` claim is what npmjs.com validates,
      # NOT the URL in package.json. GitHub's repo URL casing (e.g. "VincentChuWaiChow")
      # may differ from the OIDC claim casing (always lowercase). If npmjs.com
      # was registered with the wrong case, validation fails server-side and
      # the publish returns 404 — no amount of .npmrc stripping fixes this.
      - name: Decode OIDC token claims for trusted publisher verification
        run: |
          set -uo pipefail
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::warning::OIDC token request env vars are unset. id-token:write may not be granted."
            exit 0
          fi
          echo "::group::OIDC token claims (audience=npm)"
          RESPONSE=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm" || echo '{}')
          TOKEN=$(echo "$RESPONSE" | python3 -c "import sys, json; print(json.load(sys.stdin).get('value', ''))" 2>/dev/null || echo "")
          if [ -z "$TOKEN" ]; then
            echo "Failed to obtain OIDC token."
            echo "Response: $RESPONSE"
            exit 0
          fi
          # Decode JWT payload (middle segment, base64url-decoded). DO NOT print
          # the full token — only the claims, which are not secret.
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2)
          # Add padding for base64 decoding
          PADDING=$(( 4 - ${#PAYLOAD} % 4 ))
          if [ $PADDING -lt 4 ]; then
            PAYLOAD="${PAYLOAD}$(printf '%*s' $PADDING '' | tr ' ' '=')"
          fi
          echo "$PAYLOAD" | base64 -d 2>/dev/null | python3 -m json.tool || echo "(failed to decode)"
          echo "::endgroup::"
          echo "::group::Compare with registered trusted publisher"
          echo "Expected values (from workflow):"
          echo "  repository_owner: vincentchuwaichow (LOWERCASE — GitHub OIDC spec)"
          echo "  repository: VincentChuWaiChow/vanguard-frontier-agentic"
          echo "  workflow_ref: VincentChuWaiChow/vanguard-frontier-agentic/.github/workflows/release.yml@refs/heads/master"
          echo "  environment: npm-deployment-master"
          echo ""
          echo "If repository_owner, repository, workflow_ref, or environment"
          echo "claims above differ in case or format, the trusted publisher"
          echo "validation will fail server-side with HTTP 404."
          echo "::endgroup::"

      # Pre-download npm@^11.5.1 before the publish step so it's cached and ready.
      # This ensures GitHub Actions' npx can use it without network delays
      # during the publish attempt.
      - name: Pre-cache npm@^11.5.1 for OIDC publish
        run: npx --yes npm@^11.5.1 --version 2>&1 | head -1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Capture pre-release state
        run: |
          PRE_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo none)"
          PRE_VERSION="$(node -p "require('./package.json').version")"
          echo "PRE_TAG=$PRE_TAG" >> "$GITHUB_ENV"
          echo "PRE_VERSION=$PRE_VERSION" >> "$GITHUB_ENV"

      # Diagnostics: surface the inputs semantic-release sees. If the
      # pipeline silently no-ops, this section makes it obvious whether
      # the OIDC trusted publisher is configured, what commits are eligible,
      # and whether the remote URL is configured. No secret values are printed.
      - name: Pre-release diagnostics
        run: |
          echo "::group::Auth method"
          echo "Publishing via: npm trusted publisher (OIDC — no long-lived token)"
          echo "npm version: $(npm --version)"
          echo "GITHUB_TOKEN scopes (probe): contents=write expected for this job"
          echo "id-token:write granted: true (required for OIDC exchange)"
          echo "::endgroup::"
          echo "::group::Git remote and HEAD"
          git remote -v
          git log --oneline -10
          echo "::endgroup::"
          echo "::group::Commits since last tag"
          if [ "$PRE_TAG" != "none" ]; then
            git log --oneline "$PRE_TAG"..HEAD
          else
            echo "No previous tag; semantic-release will treat all history as candidate."
          fi
          echo "::endgroup::"
          echo "::group::package.json identity"
          node -e "const p=require('./package.json'); console.log(JSON.stringify({name:p.name,version:p.version,repository:p.repository,publishConfig:p.publishConfig}, null, 2));"
          echo "::endgroup::"

      - name: Verify asset integrity is current
        run: |
          # This step used to regenerate the manifest, commit it with
          # [skip ci] and push, all BEFORE the Validate step ran. That ordering
          # meant the release absorbed unexplained drift into its own baseline
          # and could never reject it, and the rewritten commit deliberately
          # skipped CI. Integrity drift at release time means a generator was
          # not run before merge, which is a release blocker rather than
          # something to repair unattended on the release branch.
          if ! python3 tests/validate-asset-integrity.py; then
            echo "::error::catalog/asset-integrity.json is stale at release time."
            echo "Run 'npm run asset-integrity:write' on the release commit, review the diff, and merge it before releasing."
            exit 1
          fi
          echo "Asset integrity is current."

      - name: Validate
        run: |
          python3 tests/validate-catalog.py
          python3 tests/validate-skill-manifest.py
          python3 tests/validate-asset-integrity.py
          python3 tests/validate-mcp-trust-matrix.py
          python3 tests/validate-no-lifecycle-scripts.py
          python3 tests/validate-links.py --offline

      - name: Install dependencies
        run: npm ci

      - name: Generate SBOM (pre-release source SBOM)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Release
        # In republish mode we deliberately skip semantic-release: the intent
        # is to (re)publish the current package.json version to npm without a
        # new bump/changelog/tag. Running semantic-release here would attempt a
        # git tag push, which is irrelevant to a republish and can fail
        # independently (e.g. a repo ruleset restricting tag creation). Gating
        # it keeps the OIDC npm-publish step below as the sole action in
        # republish runs.
        if: ${{ github.event.inputs.republish != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_TOKEN needed: npm CLI v9.6+ automatically performs the
          # OIDC token exchange during `npm publish` when id-token:write is
          # granted and registry-url is set to https://registry.npmjs.org.
          # Prerequisite: trusted publisher configured on npmjs.com for
          # owner=vincentchuwaichow, repo=vanguard-frontier-agentic, workflow=release.yml,
          # environment=npm-deployment-master.
        run: |
          DRY_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
            echo "Running semantic-release in dry-run mode."
          fi
          # --debug surfaces the exact reason semantic-release does or
          # does not produce a release; without it the action exits 0
          # with a single-line "no relevant changes" message that hides
          # plugin failures (auth errors, push errors, etc).
          npx semantic-release --debug $DRY_FLAG

      - name: Publish to npm via OIDC trusted publisher
        run: |
          POST_VERSION="$(node -p "require('./package.json').version")"
          REPUBLISH="${{ github.event.inputs.republish }}"
          DRY_RUN="${{ github.event.inputs.dry_run }}"
          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry-run mode enabled; skipping npm publish."
            exit 0
          fi
          if [ "$POST_VERSION" = "$PRE_VERSION" ] && [ "$REPUBLISH" != "true" ]; then
            echo "No version bump detected; skipping npm publish."
            echo "To re-publish an existing GitHub Release that failed to reach npm,"
            echo "trigger this workflow with republish=true."
            exit 0
          fi
          if [ "$REPUBLISH" = "true" ]; then
            echo "Republish mode: publishing current version $POST_VERSION to npm."
          fi

          # Derive the npm dist-tag from the version's prerelease channel.
          # npm 11.x REFUSES to publish a prerelease without an explicit --tag
          # ("You must specify a tag using --tag when publishing a prerelease
          # version"). Stable releases publish to `latest`; alpha/beta/rc
          # prereleases publish to their own channel so they never displace
          # the stable `latest` tag. This mirrors the .releaserc.js prerelease
          # config (develop → alpha).
          case "$POST_VERSION" in
            *-alpha*) NPM_DIST_TAG="alpha" ;;
            *-beta*)  NPM_DIST_TAG="beta" ;;
            *-rc*)    NPM_DIST_TAG="rc" ;;
            *-*)      NPM_DIST_TAG="next" ;;
            *)        NPM_DIST_TAG="latest" ;;
          esac

          echo "::group::OIDC publish diagnostics"
          echo "Package: @raishin/vanguard-frontier-agentic@$POST_VERSION"
          echo "npm dist-tag: $NPM_DIST_TAG"
          echo "Bundled npm version: $(npm --version)"
          echo "npx cached npm version: $(npx npm --version 2>/dev/null || echo 'not yet cached')"
          echo "OIDC token available: $([ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && echo yes || echo 'NO — id-token:write may be missing')"
          NPMRC_PATH="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          echo "Active npmrc path: $NPMRC_PATH"
          echo "registry-url .npmrc contents:"
          cat "$NPMRC_PATH" 2>/dev/null || echo "(no .npmrc found at $NPMRC_PATH)"
          echo "::endgroup::"

          # Use npx --yes npm@^11.5.1 to pin a known OIDC-capable npm.
          # npm 11.5.1+ supports native OIDC trusted-publisher token exchange.
          # Avoid npm@latest which can resolve to release candidates or versions
          # with OIDC regressions. Node 24 bundles npm 10.x which lacks OIDC.
          #
          # NOTE: --no-auth is NOT a valid npm publish flag and was previously
          # included by mistake — it gets silently ignored. The real fix relies
          # on the strip step above + npm 11.5.1's native OIDC handling when
          # ACTIONS_ID_TOKEN_REQUEST_URL is set and id-token:write is granted.
          #
          # Prereq: trusted publisher configured on npmjs.com for
          # owner=vincentchuwaichow (LOWERCASE — verify exact casing matches OIDC sub claim!)
          # repo=vanguard-frontier-agentic workflow=release.yml
          # environment=npm-deployment-master.
          if ! npx --yes npm@^11.5.1 publish \
               --registry https://registry.npmjs.org \
               --tag "$NPM_DIST_TAG" \
               --access public \
               --provenance; then
            echo "::error::npm publish failed. Confirm npmjs.com trusted publisher is configured:" \
              "owner=vincentchuwaichow repo=vanguard-frontier-agentic workflow=release.yml environment=npm-deployment-master." \
              "See docs/npm-oidc-trusted-publishing.md"
            exit 1
          fi

      # After semantic-release publishes to npm, the working tree holds the
      # newly bumped version. `npm pack` here produces a tarball that is
      # byte-identical to the one already published to the npm registry
      # (npm pack is deterministic from package.json + the `files` allowlist).
      # We attest THIS local tarball with GitHub artifact attestations on top
      # of the npm-provenance Sigstore bundle that `npm publish` already
      # produced. This is the documented "option (a)" trade-off: simpler and
      # reproducible, no extra registry round-trip.
      - name: Pack released tarball for attestation
        id: pack
        run: |
          # Only pack and attest if a release was actually published.
          POST_VERSION="$(node -p "require('./package.json').version")"
          if [ "$POST_VERSION" = "$PRE_VERSION" ]; then
            echo "no_release=true" >> "$GITHUB_OUTPUT"
            echo "No version bump detected; skipping pack + attest."
            exit 0
          fi
          TARBALL="$(npm pack --silent)"
          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "no_release=false" >> "$GITHUB_OUTPUT"