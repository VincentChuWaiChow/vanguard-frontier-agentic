name: CodeQL

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

# Top-level least-privilege baseline (Scorecard Token-Permissions). Write
# scope (security-events) is granted only on the `analyze` job.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      # security-events:write — required by github/codeql-action/analyze to
      # upload SARIF results to the code-scanning dashboard.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
          # Excludes only the intentionally-vulnerable detection test corpus
          # (tests/fixtures/frontend-security-detection). See the config file
          # for rationale; all shipped code remains in scope.
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: /language:${{ matrix.language }}
