name: CI

on:
  push:
    branches: [master]
  pull_request:

# Top-level least-privilege baseline (Scorecard Token-Permissions). All jobs
# in this workflow are read-only validators; no job needs write scope.
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Install Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Python validator dependencies
        # validate:promotion-gatekeeper imports jsonschema and fails without it.
        run: python3 -m pip install --quiet jsonschema

      # Run the aggregate validation contract rather than a hand-picked subset.
      # CI previously invoked nine validators individually while `npm run
      # validate` chains 29, so twenty gates — model policy, model params,
      # agent tool tiers, install coverage, maestro routing, skill coherence,
      # board/readme counts, release notes and more — never ran on a pull
      # request. Keeping the job id `validate` preserves the status-check name
      # that the branch ruleset requires.
      - name: Validate (full aggregate)
        run: npm run validate

  fuzz:
    name: Property-based fuzz tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run property-based fuzz tests (fast-check)
        run: npm run test:fuzz
