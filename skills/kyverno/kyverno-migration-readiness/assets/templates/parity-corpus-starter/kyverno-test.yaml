apiVersion: cli.kyverno.io/v1alpha1
kind: Test
metadata:
  name: parity-corpus-starter
policies:
  - target-policy.yaml
resources:
  - corpus.yaml
# Every row names its operation. Offline UPDATE uses identical old and new objects, so an UPDATE row
# here proves the expression tolerates UPDATE, not that a real change is caught: controls that compare
# object with oldObject need controlled-test pairs before the cohort's UPDATE parity counts.
results:
  - isValidatingPolicy: true
    policy: example-require-run-as-non-root
    kind: Pod
    resources: [payments/legitimate-workload]
    operation: CREATE
    result: pass
  - isValidatingPolicy: true
    policy: example-require-run-as-non-root
    kind: Pod
    resources: [payments/legitimate-workload]
    operation: UPDATE
    result: pass
  - isValidatingPolicy: true
    policy: example-require-run-as-non-root
    kind: Pod
    resources: [payments/violating-workload]
    operation: CREATE
    result: fail
  - isValidatingPolicy: true
    policy: example-require-run-as-non-root
    kind: Pod
    resources: [payments/violating-workload]
    operation: UPDATE
    result: fail
