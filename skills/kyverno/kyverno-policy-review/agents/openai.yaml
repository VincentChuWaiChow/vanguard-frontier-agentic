interface:
  display_name: "Kyverno Policy Review"
  short_description: "Check Kyverno rules and image checks enforce the intended control."
  default_prompt: "Use $kyverno-policy-review to decide whether the intended rule distinguishes legitimate from prohibited writes on the installed API family and whether an image rule verifies the approved signer and required claims from the supplied sanitized evidence. Report unknowns and do not perform live operations."
policy:
  allow_implicit_invocation: true
